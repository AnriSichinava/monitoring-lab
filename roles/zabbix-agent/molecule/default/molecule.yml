---
role_name_check: 2 # roles here aren't published to Galaxy; skip the FQRN naming check

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: zabbix-agent-test
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  options:
    # zabbix-agent depends on `common` (meta/main.yml), which pulls in the same
    # ntp/ssh test-environment gaps documented in roles/common/molecule/default/.
    skip-tags: ntp,ssh
  env:
    ANSIBLE_REMOTE_TMP: /tmp/.ansible-remote
    # See roles/common/molecule/default/molecule.yml for why these two paths.
    ANSIBLE_COLLECTIONS_PATH: "${ANSIBLE_HOMEBREW_COLLECTIONS:-/opt/homebrew/Cellar/ansible/14.4.0/libexec/lib/python3.14/site-packages/ansible_collections}:/Users/anrisichinava/.ansible/collections"
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      zabbix-agent-test:
        # The real role resolves zabbix_server_ip from the "monitoring_servers"
        # inventory group, which doesn't exist in this single-host scenario.
        # Override directly so the role's default Jinja expression never
        # needs to evaluate that group lookup.
        zabbix_server_ip: 127.0.0.1
        zabbix_agent_server_list: 127.0.0.1
        zabbix_agent_server_active: 127.0.0.1

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
