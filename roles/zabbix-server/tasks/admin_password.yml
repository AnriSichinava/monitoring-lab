---
- name: Check if admin password has already been rotated
  ansible.builtin.stat:
    path: /etc/zabbix/.password-rotated
  register: zabbix_password_marker

- name: Wait for Zabbix schema to be fully populated (users table has entries)
  community.postgresql.postgresql_query:
    db: "{{ zabbix_db_name }}"
    login_user: "{{ zabbix_db_user }}"
    login_password: "{{ zabbix_db_password }}"
    login_host: "{{ zabbix_db_host }}"
    login_port: "{{ zabbix_db_port }}"
    query: "SELECT COUNT(*) AS n FROM users WHERE username = %s"
    positional_args:
      - "{{ zabbix_admin_username }}"
  register: zabbix_admin_row
  when: not zabbix_password_marker.stat.exists
  no_log: true
  failed_when: zabbix_admin_row.query_result[0].n | int < 1

- name: Rotate default Zabbix admin password
  community.postgresql.postgresql_query:
    db: "{{ zabbix_db_name }}"
    login_user: "{{ zabbix_db_user }}"
    login_password: "{{ zabbix_db_password }}"
    login_host: "{{ zabbix_db_host }}"
    login_port: "{{ zabbix_db_port }}"
    query: "UPDATE users SET passwd = %s WHERE username = %s"
    positional_args:
      - "{{ zabbix_admin_password | password_hash('bcrypt') }}"
      - "{{ zabbix_admin_username }}"
  when: not zabbix_password_marker.stat.exists
  no_log: true

- name: Create password rotation marker
  ansible.builtin.file:
    path: /etc/zabbix/.password-rotated
    state: touch
    owner: root
    group: root
    mode: "0600"
  when: not zabbix_password_marker.stat.exists
