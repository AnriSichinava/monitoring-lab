---
# Defaults for the `common` role.
# Override in group_vars/host_vars — role defaults are the fallback.

common_timezone: "{{ timezone | default('UTC') }}"
common_locale: "{{ locale | default('en_US.UTF-8') }}"

common_ssh_disable_password_auth: true
common_ssh_disable_root_login: true
common_ssh_port: 22

common_unattended_upgrades_enabled: true
common_unattended_upgrades_reboot: false

common_packages:
  - curl
  - wget
  - vim
  - htop
  - net-tools
  - unzip
  - jq
  - ca-certificates
  - gnupg
  - lsb-release
  - python3
  - python3-pip

ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
