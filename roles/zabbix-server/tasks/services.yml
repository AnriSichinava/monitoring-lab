---
- name: Ensure zabbix-server is enabled and running
  ansible.builtin.systemd:
    name: zabbix-server
    enabled: true
    state: started

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Gather service facts to detect the installed PHP-FPM service name
  ansible.builtin.service_facts:

- name: Set PHP-FPM service name fact
  ansible.builtin.set_fact:
    php_fpm_service_name: "{{ ansible_facts.services | dict2items | selectattr('key', 'match', '^php.*-fpm\\.service$') | map(attribute='key') | first | default('') }}"

- name: Ensure PHP-FPM is enabled and running
  ansible.builtin.systemd:
    name: "{{ php_fpm_service_name }}"
    enabled: true
    state: started
  when: php_fpm_service_name | length > 0
