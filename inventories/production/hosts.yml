---
# Production inventory — Oracle Cloud Free Tier VMs.
# Fill in public IPs once the VMs are created.
# The ansible_user is the default cloud image user (ubuntu on Ubuntu images).

all:
  children:
    monitoring_servers:
      hosts:
        mon-server:
          ansible_host: 92.5.140.142      # public IP — used by Ansible to SSH in from the control node
          private_ip: 10.0.0.211          # VCN-internal IP — used by targets to reach the server
          ansible_user: ubuntu

    monitoring_targets:
      hosts:
        mon-target-1:
          ansible_host: 158.101.170.106
          private_ip: 10.0.0.196
          ansible_user: ubuntu
        mon-target-2:
          ansible_host: 158.101.174.32
          private_ip: 10.0.0.3
          ansible_user: ubuntu

  vars:
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519_monitoring_lab
    ansible_python_interpreter: /usr/bin/python3
