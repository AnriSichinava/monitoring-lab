---
# Defaults for the `zabbix-agent` role.
# Override in group_vars/host_vars — role defaults are the fallback.

# Zabbix version — LTS release
zabbix_major_version: "7.0"
zabbix_release_deb_version: "7.0-2"

# Which Zabbix server(s) this agent reports to.
# `zabbix_agent_server_list` = passive-check whitelist (comma-separated) — server IPs allowed to pull from the agent.
# `zabbix_agent_server_active` = active-check target — the one server the agent pushes to.
#
# Resolves to the FIRST monitoring server's PRIVATE IP (VCN-internal), because:
# - When mon-server pulls from a target, the source address on the wire is mon-server's private IP
#   (traffic goes VCN-internal, not through the internet gateway)
# - Zabbix agent's `Server=` line whitelists source IPs of incoming pulls; must match what the wire shows
# - Using the public IP here would work for cross-region setups, but is wrong for same-VCN targets
#
# Override in host_vars/mon-server.yml for self-monitor (adds 127.0.0.1 alongside).
zabbix_server_ip: "{{ hostvars[groups['monitoring_servers'][0]].private_ip }}"
zabbix_agent_server_list: "{{ zabbix_server_ip }}"
zabbix_agent_server_active: "{{ zabbix_server_ip }}"

# How this host identifies itself to Zabbix. Must match a host defined in Zabbix UI.
zabbix_agent_hostname: "{{ inventory_hostname }}"

# Listening port for passive checks (Zabbix server pulls).
zabbix_agent_listen_port: 10050

# Logging.
zabbix_agent_log_file: /var/log/zabbix/zabbix_agent2.log
zabbix_agent_log_file_size: 10

# Drop-in directory for user parameters and plugin configs.
zabbix_agent_include_dir: /etc/zabbix/zabbix_agent2.d
