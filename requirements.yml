---
# Ansible collections used across roles.
# Install with: ansible-galaxy install -r requirements.yml
collections:
  - name: community.general
    version: ">=8.0.0"
  - name: ansible.posix
    version: ">=1.5.0"
  - name: community.postgresql
    # 5.0.0 renamed postgresql_query's `db` param to `login_db` (breaking change) —
    # pin below that until roles/zabbix-server/tasks/{postgresql,schema,admin_password}.yml
    # are updated to the new param name.
    version: ">=3.0.0,<5.0.0"
  - name: community.grafana
    version: ">=1.9.0"
  - name: community.crypto
    version: ">=2.15.0"
  - name: community.zabbix
    version: ">=3.0.0"

roles: []
