---
- name: Check if admin password has already been rotated
  ansible.builtin.stat:
    path: /etc/grafana/.password-rotated
  register: grafana_password_marker

- name: Wait for Grafana to accept API calls (first-run only)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_listen_port }}/api/health"
    status_code: 200
  register: grafana_health
  retries: 30
  delay: 2
  until: grafana_health.status == 200
  when: not grafana_password_marker.stat.exists

- name: Rotate default Grafana admin password (default admin/admin → vault password)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_listen_port }}/api/user/password"
    method: PUT
    user: admin
    password: admin
    force_basic_auth: true
    body_format: json
    body:
      oldPassword: admin
      newPassword: "{{ grafana_admin_password }}"
      confirmNew: "{{ grafana_admin_password }}"
    status_code: [200, 401]  # 401 = already rotated (manually via UI or previous run)
  register: grafana_pw_rotation
  when: not grafana_password_marker.stat.exists
  no_log: true

# Always create the marker on a first-time run, whether we successfully rotated (200)
# or the password was already changed out-of-band (401). Prevents future runs from
# even trying — safer than accidentally re-rotating on a partially-completed run.
- name: Create password rotation marker
  ansible.builtin.file:
    path: /etc/grafana/.password-rotated
    state: touch
    owner: root
    group: root
    mode: "0600"
  when: not grafana_password_marker.stat.exists
