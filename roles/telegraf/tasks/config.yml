---
- name: Deploy telegraf.conf
  ansible.builtin.template:
    src: telegraf.conf.j2
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: telegraf
    mode: "0640"
  notify: Restart telegraf

- name: Ensure telegraf is enabled and running
  ansible.builtin.systemd:
    name: telegraf
    enabled: true
    state: started
