---
- name: Restart zabbix-server
  ansible.builtin.service:
    name: zabbix-server
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart php-fpm
  block:
    - name: Gather service facts to detect the installed PHP-FPM service name
      ansible.builtin.service_facts:

    - name: Restart the detected PHP-FPM service
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: "{{ ansible_facts.services | dict2items | selectattr('key', 'match', '^php.*-fpm\\.service$') | map(attribute='key') | list }}"
