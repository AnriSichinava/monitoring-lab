---
# Grafana's install package doesn't create /var/lib/grafana/plugins until the
# grafana-server service first starts. We install plugins BEFORE the first
# service start (so plugins are loaded on initial boot), which means the dir
# doesn't exist yet — create it explicitly with the right ownership.
- name: Ensure Grafana plugins directory exists
  ansible.builtin.file:
    path: /var/lib/grafana/plugins
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Check which Grafana plugins are already installed
  ansible.builtin.command: grafana-cli plugins ls
  register: grafana_installed_plugins
  changed_when: false
  check_mode: false

- name: Install Grafana plugins
  # grafana-cli needs BOTH:
  # - --homepath (where Grafana is installed, for config-defaults lookup)
  # - --pluginsDir (where installed plugin files go)
  # Auto-detection works only when run from Grafana's homepath dir; safer to be explicit.
  ansible.builtin.command:
    cmd: "grafana-cli --homepath /usr/share/grafana --pluginsDir /var/lib/grafana/plugins plugins install {{ item }}"
    chdir: /usr/share/grafana
  loop: "{{ grafana_plugins }}"
  when: item not in grafana_installed_plugins.stdout
  notify: Restart grafana-server

- name: Ensure plugin files are owned by grafana user
  # grafana-cli installs plugins as whoever ran it (root, via become). Grafana
  # server runs as the `grafana` user, so it needs read access. Chown fixes ownership
  # recursively across whatever the plugins installer created.
  ansible.builtin.file:
    path: /var/lib/grafana/plugins
    state: directory
    owner: grafana
    group: grafana
    recurse: true
