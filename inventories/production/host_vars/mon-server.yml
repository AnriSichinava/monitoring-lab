---
# Per-host overrides for mon-server.

# mon-server runs BOTH the Zabbix server and a Zabbix agent (self-monitor).
# The server connects to the local agent over loopback, so the agent's Server
# whitelist must include 127.0.0.1 alongside the public IP.
zabbix_agent_server_list: "127.0.0.1,{{ zabbix_server_ip }}"
zabbix_agent_server_active: "127.0.0.1"

# TCP ports opened by the `firewall` role.
firewall_allowed_tcp_ports:
  - 8080                                        # Zabbix web UI — public
  - { port: 10050, source: "10.0.0.0/16" }      # Zabbix agent — VCN-internal (agent only pulled by local server)
  - { port: 10051, source: "10.0.0.0/16" }      # Zabbix server — VCN-internal (targets push active checks here)
